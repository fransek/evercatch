name: "🚀 Release"

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    name: Stage npm release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token used for npm trusted publishing.
      # https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Uploads the tarball to the npm stage queue instead of publishing it
      # directly. A maintainer has to approve it with 2FA, either on npmjs.com
      # or with `npm stage approve <stage-id>`, before it becomes installable.
      # https://docs.npmjs.com/staged-publishing
      - name: Stage publish
        run: pnpm stage publish
